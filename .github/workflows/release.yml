name: Draft Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Validate game logic
        run: dotnet run --project tests/RhythmClicker.Tests -c Release
      - name: Publish portable game and verified descriptor
        shell: pwsh
        run: ./scripts/Publish-Windows.ps1 -OutputPath publish/game -ArchivePath RhythmClicker.zip -ReleaseTag "${{ github.ref_name }}"
      - name: Create reviewable draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseArgs = @('release','create',$env:RELEASE_TAG,'RhythmClicker.zip','RhythmClicker.zip.sha256','RhythmClicker.zip.manifest.json','--draft','--generate-notes')
          if($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
